spring.application.name=springBootauthpro

server.port= 9090

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/MicroServices
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/MicroServices
spring.datasource.username=root
spring.datasource.password=Ganesh5699
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

eureka.instance.prefer-ip-address=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

spring.security.user.name=admin
spring.security.user.password=admin


# Enable Prometheus endpoint with correct access
management.endpoint.prometheus.access=read-only

# Expose endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# Optional base path for actuator
management.endpoints.web.base-path=/actuator